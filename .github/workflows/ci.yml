name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run type-check
          npm test
          npm run build

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run Go Race Detector & Integration Tests (SQLCipher)
        run: go test -tags "json1,sqlite_fts5,sqlite_foreign_keys" -race ./...

      - name: Run Playwright E2E Suite
        working-directory: frontend
        run: npx playwright test

      - name: Build Windows Desktop Binary (Wails 3)
        shell: pwsh
        run: wails3 task windows:build

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
