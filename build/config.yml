version: '3'

info:
  companyName: "Janayuv"
  productName: "Import Manager"
  productIdentifier: "com.janayuv.importmanager"
  description: "Import Manager Next Generation Desktop ERP"
  copyright: "(c) 2026 Janayuv"
  comments: "Import Manager Next Generation (Wails 3 + Go + SQLCipher)"
  version: "1.0.7"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
      - scripts
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.sql"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true CGO_ENABLED=1
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
